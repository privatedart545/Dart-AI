name: Build DEV AI APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating debug.keystore for CI build..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Ensure mock google-services.json if missing
        run: |
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"0","project_id":"dev-ai-mock","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.aistudio.applet.wfisvp"}},"api_key":[{"current_key":"mock"}],"custom_attribute":{}},{"client_info":{"mobilesdk_app_id":"1:0:android:1","android_client_info":{"package_name":"com.devlkakkoth.devai"}},"api_key":[{"current_key":"mock"}],"custom_attribute":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Grant execute permission for gradlew if present
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build Debug APK with Gradle
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEV-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
